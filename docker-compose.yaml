services:
  bot:
    build:
      context: .
      dockerfile: ./Dockerfile

    image: bot:latest
    container_name: ${COMPOSE_PROJECT_NAME}-bot
    restart: always
    env_file:
      - .env

    volumes:
      - .:/usr/src/app
      - bot-venv:/usr/src/app/.venv

    working_dir: /usr/src/app

volumes:
  bot-venv:
